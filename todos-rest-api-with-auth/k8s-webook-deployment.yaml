  apiVersion: apps/v1
  kind: Deployment
  metadata:
    name: webook
  spec:
    replicas: 3
    selector:
      matchLabels:
        app: webook
    template:
      metadata:
        labels:
          app: webook
      spec:
        containers:
          - name: webook
            image: teammeng/webook:v0.0.2
            env:
              - name: PORT
                value: "8080"
              - name: DATABASE_URL
                value: postgres://postgres:postgres@webook-postgresql:5432/todo_db?sslmode=disable
            ports:
              - containerPort: 8080
